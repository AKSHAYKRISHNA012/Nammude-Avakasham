        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              kerala: {
                deep: '#064e3b',
                emerald: '#047857',
                lightGreen: '#f0fdf4',
                gold: '#d97706',
                amberGold: '#f59e0b',
                sand: '#fcfaf7',
                border: '#e2e8f0',
                surface: '#ffffff'
              }
            },
            fontFamily: {
              sans: ['"Noto Sans Malayalam"', '"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],

    <style>
      body {
        font-family: 'Noto Sans Malayalam', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #FAF8F5 0%, #F5F3EE 100%);
        color: #1A202C;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      
      /* Glassmorphism Classes */
      .glass-card {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(226, 232, 240, 0.8);
      }
      
      .glass-card-dark {
        background: rgba(6, 78, 59, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(245, 158, 11, 0.3);
      }

      .floating-dock {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.15), 0 0 1px 1px rgba(0, 0, 0, 0.05);
      }

      /* Animated Audio Equalizer Waveform */
      @keyframes soundBar {
        0%, 100% { height: 6px; }
        50% { height: 26px; }
      }
      .wave-bar-1 { animation: soundBar 0.9s ease-in-out infinite; }
      .wave-bar-2 { animation: soundBar 0.7s ease-in-out infinite 0.2s; }
      .wave-bar-3 { animation: soundBar 1.1s ease-in-out infinite 0.4s; }
      .wave-bar-4 { animation: soundBar 0.8s ease-in-out infinite 0.1s; }
      .wave-bar-5 { animation: soundBar 1.0s ease-in-out infinite 0.3s; }

      /* Scanning Line Animation */
      @keyframes scanSweep {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(300%); }
      }
      .laser-scan-line {
        animation: scanSweep 2s ease-in-out infinite;
      }

      /* High Contrast Accessibility Theme */
      .high-contrast {
        background: #000000 !important;
        color: #FFFF00 !important;
      }
      .high-contrast .glass-card,
      .high-contrast .bg-white,
      .high-contrast .bg-gray-50,
      .high-contrast .floating-dock {
        background: #111111 !important;
        border-color: #FFFF00 !important;
        color: #FFFFFF !important;
      }
      .high-contrast button {
        border: 2px solid #FFFF00 !important;
      }
      .high-contrast a, .high-contrast text, .high-contrast span {
        color: #FFFF00 !important;
      }

      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F1F1F1;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }

      /* Pulsing Microphones */
      @keyframes micPulseGlow {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7);
        }
        50% {
          transform: scale(1.06);
          box-shadow: 0 0 0 20px rgba(220, 38, 38, 0);
        }
      }
      .animate-mic-pulse {
        animation: micPulseGlow 1.8s infinite;
      }
    </style>
